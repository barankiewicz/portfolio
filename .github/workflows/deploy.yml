name: deployuj

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy-ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skopiuj pliki publiczne do _site/
        run: |
          mkdir -p _site
          cp index.html style.css script.js field.js cloud.js cloud-cells.bin Alicja-Barankiewicz_CV_data_engineer.pdf _site/
          cp -r fonts _site/
          cp *.mp4 _site/ 2>/dev/null || true
          cp *.png _site/ 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > _site/deploy-revision.txt
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Wyślij przez FTP (lh.pl) using lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; mirror -R ./_site/ portfolio/; quit"
      - name: Verify live revision
        run: |
          for attempt in 1 2 3 4 5; do
            live_sha=$(curl -fsS --max-time 10 "https://barankiewicz.dev/deploy-revision.txt?cb=$GITHUB_SHA" || true)
            if [ "$live_sha" = "$GITHUB_SHA" ]; then
              echo "Live revision verified: $GITHUB_SHA"
              exit 0
            fi
            sleep 3
          done
          echo "Live site did not serve deployed revision" >&2
          exit 1
